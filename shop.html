<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | Glaze Lab</title>
<meta name="description" content="Browse all Glaze Lab mugs, bowls, plates, vases and planters.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c6 7 10 11 10 16a10 10 0 0 1-20 0c0-5 4-9 10-16z' fill='%232547D0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">

<div class="wrap">
  <div class="page-head"><h1>Shop</h1><p>Search, filter by type or sort by price to find your piece.</p></div>
  <div class="controls">
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    <div class="tools">
      <div><label for="search">Search</label><input id="search" type="search" placeholder="Try &quot;mug&quot; or &quot;blue&quot;" autocomplete="off"></div>
      <div><label for="sort">Sort by</label><select id="sort"><option value="featured">Featured</option><option value="price-asc">Price, low to high</option><option value="price-desc">Price, high to low</option><option value="name">Name, A to Z</option></select></div>
    </div>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="shop-grid"></div>
  <div class="empty" id="shop-empty" hidden><h2>No products match</h2><p>Try a different search or clear your filters.</p><button class="btn" type="button" id="reset">Clear filters</button></div>
</div>
<div class="section"></div>

</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
