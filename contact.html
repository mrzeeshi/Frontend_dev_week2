<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Glaze Lab</title>
<meta name="description" content="Get in touch with the Glaze Lab studio.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c6 7 10 11 10 16a10 10 0 0 1-20 0c0-5 4-9 10-16z' fill='%232547D0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">

<div class="wrap section">
  <h1>Contact us</h1>
  <div class="contact-grid" style="margin-top:2rem">
    <div class="info">
      <p>Questions about an order, a glaze or a custom set? Send us a note and we will get back to you.</p>
      <p><strong>Email</strong>hello@glazelab.example</p>
      <p><strong>Phone</strong>+1 (555) 010-2040</p>
      <p><strong>Studio</strong>12 Kiln Street, Studio 4<br>Open Monday to Friday, 10:00 to 17:00</p>
    </div>
    <form id="contact-form" novalidate>
      <div id="contact-ok" class="success" role="status" tabindex="-1" hidden></div>
      <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" required aria-describedby="name-err"><p class="err" id="name-err"></p></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-err"><p class="err" id="email-err"></p></div>
      <div class="field"><label for="subject">Subject</label><select id="subject" name="subject" required aria-describedby="subject-err"><option value="">Choose a subject</option><option>Order question</option><option>Product question</option><option>Custom order</option><option>Something else</option></select><p class="err" id="subject-err"></p></div>
      <div class="field"><label for="message">Message</label><textarea id="message" name="message" required aria-describedby="message-err"></textarea><p class="err" id="message-err"></p></div>
      <button class="btn" type="submit">Send message</button>
    </form>
  </div>
</div>

</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
